<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RicCoin — Consulta de Criptomoedas</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RicCoin">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4472840466327433"
     crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0A0C10;
    --surface: #12151C;
    --surface-hi: #171B24;
    --line: #262B36;
    --text: #FFFFFF;
    --muted: #8B93A7;
    --up: #33D17E;
    --up-bg: #10281B;
    --down: #FF5C7A;
    --down-bg: #2E141C;
    --brand: #5B6EF5;
    --brand-glow: #8B98FF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 24px 20px 0;
  }

  .brand {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    color: var(--text);
  }

  .brand span { color: var(--brand); }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 18px;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
  }

  .tab {
    padding: 0 0 12px;
    margin-right: 22px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--up);
  }

  .portfolio-card {
    margin: 18px 20px 0;
    padding: 20px;
    background: var(--up-bg);
    border: 1px solid #1F5C3A;
    border-radius: 16px;
  }

  .portfolio-label {
    display: inline-block;
    color: var(--up);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: rgba(51,209,126,0.12);
    padding: 4px 10px;
    border-radius: 100px;
    margin: 0 0 12px;
  }

  .portfolio-value {
    font-family: 'Inter', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 2px;
  }

  .portfolio-delta {
    font-size: 13px;
    color: var(--muted);
  }

  .search-row {
    padding: 18px 20px 10px;
  }

  .search-row input {
    width: 100%;
    padding: 13px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 100px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-row input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(91,110,245,0.25);
  }

  .search-row input::placeholder { color: var(--muted); }

  .ad-slot {
    margin: 14px 20px;
    min-height: 20px;
  }

  .coin-list {
    padding: 4px 20px 20px;
    flex: 1;
  }

  .coin-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }

  .coin-row:active { background: var(--surface); }

  .coin-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--surface-hi);
  }

  .coin-info { flex: 1; min-width: 0; }

  .coin-name {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .coin-symbol {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
  }

  .coin-price-block {
    text-align: right;
    flex-shrink: 0;
  }

  .coin-price {
    font-size: 14px;
    font-weight: 700;
  }

  .coin-change {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 100px;
  }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .coin-change.up { background: var(--up-bg); }
  .coin-change.down { background: var(--down-bg); }

  @keyframes flashUp {
    0% { background: rgba(34,240,176,0.35); }
    100% { background: transparent; }
  }
  @keyframes flashDown {
    0% { background: rgba(255,77,109,0.35); }
    100% { background: transparent; }
  }
  .coin-price.flash-up { animation: flashUp 0.9s ease-out; border-radius: 4px; }
  .coin-price.flash-down { animation: flashDown 0.9s ease-out; border-radius: 4px; }

  .live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 6px;
    box-shadow: 0 0 6px var(--up);
    animation: pulseDot 1.4s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .star {
    font-size: 16px;
    color: var(--muted);
    flex-shrink: 0;
    width: 20px;
    text-align: center;
  }

  .star.active { color: var(--brand-glow); }

  .state-msg {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 20px;
  }

  footer {
    padding: 16px 20px 30px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="brand">RicCoin<span>.</span></p>
    <p class="subtitle"><span class="live-dot"></span>Preços de criptomoedas em tempo real</p>
    <nav class="tabs">
      <span class="tab active">Moedas</span>
      <a class="tab" href="/sobre.html">Sobre</a>
      <a class="tab" href="/privacidade.html">Privacidade</a>
    </nav>
  </header>

  <div class="portfolio-card">
    <div class="portfolio-label">SEUS FAVORITOS</div>
    <div class="portfolio-value" id="favTotal">—</div>
    <div class="portfolio-delta" id="favDelta">carregando...</div>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Buscar moeda (bitcoin, ethereum...)">
  </div>

  <!-- ESPAÇO DE ANÚNCIO 1 (banner topo da lista) -->
  <div class="ad-slot" id="adSlotTop">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-4472840466327433"
         data-ad-slot="7924814323"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <div class="coin-list" id="coinList">
    <div class="state-msg">Carregando preços...</div>
  </div>

  <footer>
    Dados fornecidos pela API pública CoinGecko. Preços apenas informativos, não constituem recomendação de investimento.<br>
    <a href="/sobre.html" style="color: var(--muted);">Sobre</a> · <a href="/privacidade.html" style="color: var(--muted);">Política de Privacidade</a><br>
    Grupo Riccieri - 2026
  </footer>

</div>

<script>
const API_URL = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=brl&order=market_cap_desc&per_page=30&page=1&sparkline=false&price_change_percentage=24h";

let coins = [];
let previousPrices = {}; // guarda o último preço conhecido de cada moeda para detectar variação
let favorites = JSON.parse(sessionStorage_safe_get());

function sessionStorage_safe_get() {
  // Ambiente de artifact não suporta localStorage/sessionStorage do navegador.
  // Ao publicar este app fora do Claude, troque esta função por localStorage.getItem('favorites') || '[]'
  window.__favCache = window.__favCache || '[]';
  return window.__favCache;
}

function saveFavorites() {
  window.__favCache = JSON.stringify(favorites);
}

function formatBRL(value) {
  return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: value < 1 ? 6 : 2 });
}

function renderList(filter = '') {
  const list = document.getElementById('coinList');
  const filtered = coins.filter(c =>
    c.name.toLowerCase().includes(filter.toLowerCase()) ||
    c.symbol.toLowerCase().includes(filter.toLowerCase())
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="state-msg">Nenhuma moeda encontrada.</div>';
    return;
  }

  list.innerHTML = filtered.map((c, idx) => {
    const isFav = favorites.includes(c.id);
    const change = c.price_change_percentage_24h || 0;
    const changeClass = change >= 0 ? 'up' : 'down';
    const changeSign = change >= 0 ? '+' : '';

    let row = `
      <div class="coin-row" data-id="${c.id}">
        <div class="star ${isFav ? 'active' : ''}" data-star="${c.id}">${isFav ? '★' : '☆'}</div>
        <img class="coin-icon" src="${c.image}" alt="${c.name}">
        <div class="coin-info">
          <div class="coin-name">${c.name}</div>
          <div class="coin-symbol">${c.symbol}</div>
        </div>
        <div class="coin-price-block">
          <div class="coin-price" data-price-id="${c.id}">${formatBRL(c.current_price)}</div>
          <div class="coin-change ${changeClass}">${changeSign}${change.toFixed(2)}%</div>
        </div>
      </div>
    `;

    // ESPAÇO DE ANÚNCIO NATIVO: a cada 8 moedas, insere um slot de anúncio in-feed
    if ((idx + 1) % 8 === 0) {
      row += `<div class="ad-slot">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="fluid"
             data-ad-layout-key="-6t+ed+2i-1n-4w"
             data-ad-client="ca-pub-4472840466327433"
             data-ad-slot="6461139511"></ins>
      </div>`;
    }

    return row;
  }).join('');

  // Ativa cada bloco de anúncio in-feed inserido nesta renderização
  document.querySelectorAll('.ad-slot .adsbygoogle:not([data-adsbygoogle-status])').forEach(() => {
    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
  });

  document.querySelectorAll('[data-star]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-star');
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
      } else {
        favorites.push(id);
      }
      saveFavorites();
      renderList(document.getElementById('searchInput').value);
      updateFavSummary();
    });
  });
}

function updateFavSummary() {
  const favCoins = coins.filter(c => favorites.includes(c.id));
  const totalEl = document.getElementById('favTotal');
  const deltaEl = document.getElementById('favDelta');

  if (favCoins.length === 0) {
    totalEl.textContent = '—';
    deltaEl.textContent = 'toque na ★ ao lado de uma moeda para acompanhar';
    deltaEl.className = 'portfolio-delta';
    return;
  }

  const avgChange = favCoins.reduce((sum, c) => sum + (c.price_change_percentage_24h || 0), 0) / favCoins.length;
  totalEl.textContent = favCoins.length + (favCoins.length === 1 ? ' moeda acompanhada' : ' moedas acompanhadas');
  deltaEl.textContent = `variação média 24h: ${avgChange >= 0 ? '+' : ''}${avgChange.toFixed(2)}%`;
  deltaEl.className = 'portfolio-delta ' + (avgChange >= 0 ? 'up' : 'down');
}

let firstLoad = true;

async function loadPrices() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('Falha na API');
    const newCoins = await res.json();

    // detecta variação de preço em relação à última atualização para o efeito "ao vivo"
    const changedUp = [];
    const changedDown = [];
    newCoins.forEach(c => {
      const prev = previousPrices[c.id];
      if (prev !== undefined && prev !== c.current_price) {
        if (c.current_price > prev) changedUp.push(c.id);
        else changedDown.push(c.id);
      }
      previousPrices[c.id] = c.current_price;
    });

    coins = newCoins;

    // Só remonta a lista inteira (e os blocos de anúncio) na primeira carga ou ao filtrar.
    // Nas atualizações seguintes, só troca o texto de preço/variação já na tela —
    // isso evita recriar os anúncios do AdSense a cada atualização (o que violaria
    // as políticas de "refresh" automático de anúncios do Google).
    if (firstLoad) {
      renderList(document.getElementById('searchInput').value);
      firstLoad = false;
    } else {
      updatePricesInPlace();
    }
    updateFavSummary();

    changedUp.forEach(id => flashPrice(id, 'flash-up'));
    changedDown.forEach(id => flashPrice(id, 'flash-down'));
  } catch (err) {
    document.getElementById('coinList').innerHTML =
      '<div class="state-msg">Não foi possível carregar os preços agora. Tente novamente em instantes.</div>';
  }
}

function updatePricesInPlace() {
  coins.forEach(c => {
    const priceEl = document.querySelector(`[data-price-id="${c.id}"]`);
    if (!priceEl) return; // moeda não está na tela (fora do filtro atual)
    priceEl.textContent = formatBRL(c.current_price);

    const row = document.querySelector(`.coin-row[data-id="${c.id}"]`);
    if (!row) return;
    const changeEl = row.querySelector('.coin-change');
    const change = c.price_change_percentage_24h || 0;
    const changeClass = change >= 0 ? 'up' : 'down';
    const changeSign = change >= 0 ? '+' : '';
    if (changeEl) {
      changeEl.textContent = `${changeSign}${change.toFixed(2)}%`;
      changeEl.className = `coin-change ${changeClass}`;
    }
  });
}

function flashPrice(id, cls) {
  const el = document.querySelector(`[data-price-id="${id}"]`);
  if (!el) return;
  el.classList.remove('flash-up', 'flash-down');
  // força reflow para reiniciar a animação mesmo se o preço mudar de novo rapidamente
  void el.offsetWidth;
  el.classList.add(cls);
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  renderList(e.target.value);
});

loadPrices();
setInterval(loadPrices, 8000); // atualiza a cada 8s para sensação de tempo real

// Registra o service worker para permitir instalar o RicCoin como app
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => {
      console.log('Falha ao registrar service worker:', err);
    });
  });
}
</script>

</body>
</html>
